### model
model_name_or_path: Qwen/Qwen2.5-7B
quantization_bit: 4

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.05

### dataset
dataset: alpaca_en
template: qwen
cutoff_len: 1024
max_samples: 52000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /ibex/scratch/zahrmm0b/safety-overrefusal-project/checkpoints/qwen2.5_7b_sft_alpaca
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
resume_from_checkpoint: /ibex/scratch/zahrmm0b/safety-overrefusal-project/checkpoints/qwen2.5_7b_sft_alpaca/checkpoint-2000
