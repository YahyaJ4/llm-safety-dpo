### Model
model_name_or_path: Qwen/Qwen2.5-7B
adapter_name_or_path: /ibex/scratch/zahrmm0b/safety-overrefusal-project/checkpoints/qwen2.5_7b_sft_alpaca

### Method
stage: dpo
do_train: true
finetuning_type: lora
lora_target: all
pref_beta: 0.1

### Dataset
dataset: pku_safety_strict
template: qwen
cutoff_len: 1024
max_samples: 3000
overwrite_cache: true
preprocessing_num_workers: 16

### Output
output_dir: /ibex/scratch/zahrmm0b/safety-overrefusal-project/checkpoints/qwen2.5_7b_dpo_pku_strict_beta0.1
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### Train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### Eval
val_size: 0.05
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 200
